name: Daily Docker Cache

on:
  schedule:
    - cron: '0 11 * * 1-5' # Monday - Friday at 4am Arizona Time
  workflow_dispatch:

permissions: {}

jobs:
  call-refresh-docker-cache-workflow:
    uses: terascope/workflows/.github/workflows/refresh-docker-cache.yml@1a5d64fcdb79d88443f0eb9468a9bd8117cc4bea
    permissions:
      actions: write
      contents: read
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
